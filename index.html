S · 17 NOV"}, {"t": "EASA’s conflict-zone advisory covering the UAE now runs until 31 January 2027.", "s": "TRAVELMOLE · 19 NOV"}, {"t": "Emirates, flydubai and Air Arabia are running selected services to Saudi Arabia.", "s": "GULF NEWS · 21 NOV"}], "airports": [{"code": "DXB", "name": "Dubai International", "city": "Dubai", "info": "One of the world’s busiest international airports and the Emirates hub.", "icao": "OMDB", "live": "https://globe.adsbexchange.com/?lat=25.253&lon=55.365&zoom=11"}, {"code": "AUH", "name": "Zayed International", "city": "Abu Dhabi", "info": "Home of Etihad Airways.", "icao": "OMAA", "live": "https://globe.adsbexchange.com/?lat=24.433&lon=54.651&zoom=11"}, {"code": "DWC", "name": "Al Maktoum International", "city": "Dubai South", "info": "Dubai’s second airport and a major private-jet hub.", "icao": "OMDW", "live": "https://globe.adsbexchange.com/?lat=24.896&lon=55.161&zoom=11"}], "ap_note": ""}, "QA": {"name": "Qatar", "ar": "قطر", "status": "Advisory", "color": "#E3A73F", "summary": "Flights are operating normally from Doha, under Europe’s Gulf conflict-zone advisory.", "news": [{"t": "Qatar Airways has restarted daily flights to Riyadh and Dammam.", "s": "TRAVELMOLE · 19 NOV"}, {"t": "EASA’s Gulf advisory covering Qatar is extended to 31 January 2027.", "s": "TRAVELMOLE · 19 NOV"}], "airports": [{"code": "DOH", "name": "Hamad International", "city": "Doha", "info": "Qatar’s main airport and the Qatar Airways hub.", "icao": "OTHH", "live": "https://globe.adsbexchange.com/?lat=25.273&lon=51.608&zoom=11"}, {"code": "DIA", "name": "Doha International", "city": "Doha", "info": "The original Doha airport, now used for limited and special flights.", "icao": "OTBD", "live": "https://globe.adsbexchange.com/?lat=25.261&lon=51.565&zoom=11"}], "ap_note": "Qatar has two civil airports."}, "BH": {"name": "Bahrain", "ar": "البحرين", "status": "Advisory", "color": "#E3A73F", "summary": "Bahrain International is operating, and Gulf Air has restarted Riyadh flights. Europe’s Gulf advisory still applies.", "news": [{"t": "Gulf Air has resumed operations at Riyadh Airport.", "s": "TRAVELS DUBAI · 21 NOV"}, {"t": "EASA’s Gulf advisory covering Bahrain is extended to 31 January 2027.", "s": "TRAVELMOLE · 19 NOV"}], "airports": [{"code": "BAH", "name": "Bahrain International", "city": "Muharraq", "info": "The country’s only civil airport and the Gulf Air hub.", "icao": "OBBI", "live": "https://globe.adsbexchange.com/?lat=26.271&lon=50.634&zoom=11"}], "ap_note": "Bahrain has one civil airport."}, "KW": {"name": "Kuwait", "ar": "الكويت", "status": "Advisory", "color": "#E3A73F", "summary": "Kuwait International is open. Kuwait is covered by Europe’s Gulf conflict-zone advisory.", "news": [{"t": "EASA’s Gulf advisory covering Kuwait is extended to 31 January 2027.", "s": "TRAVELMOLE · 19 NOV"}], "airports": [{"code": "KWI", "name": "Kuwait International", "city": "Kuwait City", "info": "The country’s only civil airport and the Kuwait Airways hub.", "icao": "OKKK", "live": "https://globe.adsbexchange.com/?lat=29.227&lon=47.969&zoom=11"}], "ap_note": "Kuwait has one civil airport."}, "OM": {"name": "Oman", "ar": "عُمان", "status": "Advisory", "color": "#E3A73F", "summary": "Omani airports are operating, under Europe’s conflict-zone advisory for the Gulf and Gulf of Oman.", "news": [{"t": "EASA’s advisory for the Gulf of Oman and Omani airspace is extended to 31 January 2027.", "s": "TRAVELMOLE · 19 NOV"}], "airports": [{"code": "MCT", "name": "Muscat International", "city": "Muscat", "info": "Oman’s main airport and the Oman Air hub.", "icao": "OOMS", "live": "https://globe.adsbexchange.com/?lat=23.593&lon=58.284&zoom=11"}, {"code": "SLL", "name": "Salalah", "city": "Salalah", "info": "Gateway to the south, busiest in the summer khareef season.", "icao": "OOSA", "live": "https://globe.adsbexchange.com/?lat=17.039&lon=54.091&zoom=11"}, {"code": "DQM", "name": "Duqm International", "city": "Duqm", "info": "A newer airport serving the Duqm economic zone.", "icao": "OODQ", "live": "https://globe.adsbexchange.com/?lat=19.501&lon=57.634&zoom=11"}], "ap_note": ""}};
let GULF_ASOF = "22 November 2026, 18:45 London";
const APS = {"RUH": [479.2, 306.9, 10, 4], "JED": [194.7, 440.4, 10, 4], "DMM": [596.2, 245.4, -10, 4], "DXB": [806.0, 295.1, 10, -6], "DWC": [798.5, 309.3, 10, 8], "AUH": [779.2, 328.4, -10, 10], "DOH": [664.5, 294.3, 10, 2], "DIA": [662.6, 294.7, -10, 10], "BAH": [627.5, 253.6, -10, 14], "KWI": [527.2, 132.7, 10, 14], "MCT": [916.2, 362.6, 10, 4], "SLL": [758.1, 629.2, 10, 4], "DQM": [891.7, 529.1, 10, 4]};
const AP_C = {"RUH": "SA", "JED": "SA", "DMM": "SA", "DXB": "AE", "AUH": "AE", "DWC": "AE", "DOH": "QA", "DIA": "QA", "BAH": "BH", "KWI": "KW", "MCT": "OM", "SLL": "OM", "DQM": "OM"};
const BOUNDS = {"SA": [24, 14, 818, 657], "OM": [679, 248, 974, 645], "AE": [663, 262, 845, 407], "KW": [474, 99, 544, 162], "QA": [632, 260, 664, 323], "BH": [600, 235, 650, 290]};
const MW = 1000, MH = 834;
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sel: 'SA', page: 'home', ap: null, z: 1, cx: 500, cy: 417.0 }; }
go(p) { this.setState({ page: p }); try { window.scrollTo(0, 0); } catch (e) {} }
view(z, cx, cy) {
z = Math.max(1, Math.min(10, z));
const w = MW / z, h = MH / z;
cx = Math.max(w / 2, Math.min(MW - w / 2, cx));
cy = Math.max(h / 2, Math.min(MH - h / 2, cy));
return { z: z, cx: cx, cy: cy };
}
fit(c) {
const b = BOUNDS[c];
const z = Math.min(MW / (b[2] - b[0]), MH / (b[3] - b[1])) / 1.6;
return this.view(z, (b[0] + b[2]) / 2, (b[1] + b[3]) / 2);
}
pickCountry(c) { this.setState(Object.assign({ sel: c, ap: null }, this.fit(c))); }
pickAirport(code) {
const c = AP_C[code];
const p = APS[code];
const z = Math.max(this.state.z, Math.min(6, this.fit(c).z * 1.4));
this.setState(Object.assign({ sel: c, ap: code }, this.view(z, p[0], p[1])));
}
renderVals() {
const st = this.state;
const s = st.sel, pg = st.page;
const v = {};
['home','news','map','stories','rankings','about','live'].forEach((p) => {
const on = p === pg;
v['show_' + p] = on ? 'block' : 'none';
v['go_' + p] = () => this.go(p);
v['cur_' + p] = on ? 'page' : 'false';
v['col_' + p] = on ? '#D2B16A' : '#F2EAD8';
v['line_' + p] = on ? '#D2B16A' : 'transparent';
});
v.live_src = pg === 'live' ? '/live/' : 'about:blank';
v.show_follow = (pg === 'home' || pg === 'about') ? 'block' : 'none';
const z = st.z, k = 1 / Math.pow(z, 0.8);
const w = MW / z, h = MH / z;
v.vb = (st.cx - w / 2).toFixed(1) + ' ' + (st.cy - h / 2).toFixed(1) + ' ' + w.toFixed(1) + ' ' + h.toFixed(1);
v.zlabel = (Math.round(z * 10) / 10) + 'x';
v.cfs = (17 * k).toFixed(2); v.xfs = (14 * k).toFixed(2); v.afs = (13 * k).toFixed(2);
v.hr = (14 * k).toFixed(2); v.bhr = Math.max(9, 16 * k).toFixed(2); v.tsw = (3.5 * k).toFixed(2);
v.lead_o = z < 2.5 ? 1 : 0; v.inl_o = z < 2.5 ? 0 : 1; v.ifs = (11 * k).toFixed(2); v.bhly = (260.5 + Math.max(9, 16 * k) + 14 * k).toFixed(1);
v.zin = () => this.setState(this.view(z * 1.6, st.cx, st.cy));
v.zout = () => this.setState(this.view(z / 1.6, st.cx, st.cy));
v.zreset = () => this.setState({ z: 1, cx: MW / 2, cy: MH / 2, ap: null });
v.pu = () => this.setState(this.view(z, st.cx, st.cy - h * 0.25));
v.pd = () => this.setState(this.view(z, st.cx, st.cy + h * 0.25));
v.pl = () => this.setState(this.view(z, st.cx - w * 0.25, st.cy));
v.pr = () => this.setState(this.view(z, st.cx + w * 0.25, st.cy));
Object.keys(APS).forEach((code) => {
const p = APS[code], on = code === st.ap;
v['r_' + code] = ((on ? 7.5 : 5) * k).toFixed(2);
v['f_' + code] = on ? '#D2B16A' : '#F2EAD8';
v['lx_' + code] = (p[0] + p[2] * k).toFixed(1);
v['ly_' + code] = (p[1] + p[3] * k).toFixed(1);
v['o_' + code] = (code === 'DIA' && z < 2 && !on) ? 0 : 1;
v['ap_' + code] = () => this.pickAirport(code);
});
['SA','AE','QA','BH','KW','OM'].forEach((c) => {
const on = c === s;
v['fill_' + c] = GULF[c].color;
v['stroke_' + c] = on ? '#F2EAD8' : '#0D2620';
v['sw_' + c] = on ? 3 : 1.5;
v['bg_' + c] = on ? 'rgba(210,177,106,0.18)' : 'transparent';
v['pick_' + c] = () => this.pickCountry(c);
});
v.gulf_asof = GULF_ASOF;
const d = GULF[s];
v.sel = Object.assign({}, d, { statusUp: d.status.toUpperCase() });
v.aps = d.airports.map((a) => Object.assign({}, a, {
cityUp: a.city.toUpperCase(),
border: a.code === st.ap ? '#D2B16A' : 'rgba(210,177,106,0.35)',
pick: () => this.pickAirport(a.code)
}));
return v;
}
}

// Tiny runtime that renders the page template ({{bindings}}, <sc-for> loops, onClick handlers).
let TPL = document.getElementById('tpl').textContent;
const TPL0 = TPL;
function applyNews(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let t = TPL0;
  doc.querySelectorAll('section[data-list]').forEach((sec) => { t = t.replace('<!--LIST:' + sec.dataset.list + '-->', sec.innerHTML.replace(/\{\{|\}\}/g, '')); });
  TPL = t;
}
const RAW = 'https://raw.githubusercontent.com/hasalekri/privatejetly-site/main/data/';
async function loadData() {
  const bust = '?v=' + Math.floor(Date.now() / 120000);
  const get = async (f, type) => { for (const u of [RAW + f + bust, '/data/' + f]) { try { const r = await fetch(u, { cache: 'no-store' }); if (r.ok) return type === 'json' ? await r.json() : await r.text(); } catch (e) {} } return null; };
  const [news, gulf] = await Promise.all([get('news.html', 'text'), get('gulf.json', 'json')]);
  if (news) applyNews(news);
  if (gulf && gulf.countries) { GULF = gulf.countries; GULF_ASOF = gulf.status_as_of || GULF_ASOF; }
  render();
}
const ROOT = document.getElementById('root');
const esc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
let handlers = [];
function fill(html, scope) {
  html = html.replace(/onClick="\{\{([\w.]+)\}\}"/g, (m, p) => { const f = get(scope, p); if (typeof f !== 'function') return ''; handlers.push(f); return 'data-h="' + (handlers.length - 1) + '"'; });
  return html.replace(/\{\{([\w.]+)\}\}/g, (m, p) => { const v = get(scope, p); return v == null || typeof v === 'function' ? '' : esc(v); });
}
function render() {
  handlers = [];
  const vals = comp.renderVals();
  let html = TPL.replace(/<sc-for list="\{\{([\w.]+)\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g, (m, list, as, inner) =>
    (get(vals, list) || []).map((item) => fill(inner, Object.assign({}, vals, { [as]: item }))).join(''));
  ROOT.innerHTML = fill(html, vals);
  const pg = comp.state.page;
  if (pg && location.hash !== '#' + pg) { try { history.replaceState(null, '', pg === 'home' ? location.pathname : '#' + pg); } catch (e) {} }
}
ROOT.addEventListener('click', (e) => { const el = e.target.closest('[data-h]'); if (!el) return; e.preventDefault(); const f = handlers[+el.dataset.h]; if (f) f(e); });
const comp = new Component({});
const start = location.hash.slice(1);
if (['news', 'map', 'stories', 'rankings', 'about', 'live'].includes(start)) comp.state.page = start;
render();
loadData();

}
