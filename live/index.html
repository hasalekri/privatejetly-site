<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>Jet Majlis · Live Radar</title>
<link rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://globe.airplanes.live">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--tx:#F2EAD8;--mu:#9C978C;--ac:#D2B16A;--ln:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B0B0C;color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
.bar{position:absolute;top:0;left:0;right:0;height:52px;z-index:2;display:flex;align-items:center;gap:12px;padding:0 12px;background:rgba(14,14,16,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:9px;color:var(--tx);text-decoration:none;margin-right:auto}
.brand img{width:30px;height:30px;border-radius:50%}
.brand b{font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:.2em;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mu)}
.dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}}
.pill{height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;border:1px solid rgba(210,177,106,.4);color:var(--ac);font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.pill:hover{background:rgba(210,177,106,.1)}
iframe{position:absolute;top:52px;left:0;width:100%;height:calc(100% - 52px);border:0;background:#0B0B0C}
.credit{position:absolute;right:8px;bottom:6px;z-index:2;font-size:10px;color:var(--mu);background:rgba(0,0,0,.6);padding:3px 8px;border-radius:999px}
.credit a{color:var(--mu)}
.in-frame .brand b{display:none}
@media(max-width:520px){.live span{display:none}.brand b{font-size:14px;letter-spacing:.12em}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<script>if(window.self!==window.top)document.documentElement.classList.add('in-frame');</script>
<div class="bar">
  <a class="brand" href="/" target="_top"><img src="/img/logo-180.png" alt=""><b>JET MAJLIS</b></a>
  <span class="live"><i class="dot"></i><span>ALL LIVE TRAFFIC</span></span>
  <a class="pill" href="/live/map.html" target="_top">Bahrain IFR map</a>
</div>
<iframe src="https://globe.airplanes.live/?lat=24.6&lon=47.5&zoom=5" title="Live map of all aircraft over the Gulf and Saudi Arabia" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<span class="credit">Live map by <a href="https://airplanes.live" target="_blank" rel="noopener">airplanes.live</a> (non-commercial use)</span>
</body>
</html>
