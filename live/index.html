<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>Jet Majlis · Live Radar</title>
<link rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://api.adsb.lol">
<link rel="preconnect" href="https://opendata.adsb.fi">
<style>
:root{--bg:#0B0B0C;--glass:rgba(16,16,18,.72);--glass2:rgba(24,24,27,.86);--tx:#F2EAD8;--mu:#9C978C;--ac:#D2B16A;--ln:rgba(255,255,255,.08);--ln2:rgba(210,177,106,.35);--gr:#4ADE80;--r:16px;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#map{position:absolute;inset:0;background:#08090A}
#cv{position:absolute;inset:0;z-index:450;pointer-events:none}
.leaflet-zoom-anim #cv{opacity:0}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.ui{position:absolute;z-index:1000}
/* top bar */
.top{top:12px;left:12px;right:12px;display:flex;align-items:center;gap:14px;padding:8px 10px 8px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx);margin-right:auto}
.brand img{width:32px;height:32px;border-radius:50%}
.brand b{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;letter-spacing:.22em}
.brand small{display:block;font-size:10px;letter-spacing:.24em;color:var(--mu);font-weight:600;margin-top:-2px}
.live{display:inline-flex;align-items:center;gap:8px;font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--mu);padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--ln)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:p 1.6s infinite}
.dot.off{background:#F87171;animation:none}.dot.wait{background:var(--ac)}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.kpis{display:flex;gap:6px}
.kpi{padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--ln);text-align:left}
.kpi b{display:block;font:600 17px/1.1 var(--mono);color:var(--tx)}
.kpi.g b{color:var(--ac)}
.kpi span{font-size:10px;letter-spacing:.14em;color:var(--mu);font-weight:600;text-transform:uppercase}
/* tool row */
.tools{top:78px;left:12px;display:flex;flex-direction:column;gap:10px;padding:10px;width:300px}
.search{position:relative}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--ln);background:rgba(0,0,0,.35);padding:0 12px 0 36px;outline:none;font-size:14px}
.search input:focus{border-color:var(--ln2)}
.search svg{position:absolute;left:12px;top:12px;opacity:.6}
#hits{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto}
#hits button{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:0;border-radius:10px;background:transparent;text-align:left}
#hits button:hover,#hits button:focus-visible{background:rgba(255,255,255,.06)}
#hits small{color:var(--mu);font-family:var(--mono)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--ln)}
.seg button{height:32px;border:0;border-radius:9px;background:transparent;font-size:12px;font-weight:600;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--tx);color:#0B0B0C}
.row{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--ln);background:rgba(255,255,255,.04);font-size:12px;font-weight:600;color:var(--tx)}
.pill:hover{border-color:var(--ln2)}
.pill[aria-pressed=true]{border-color:var(--ac);color:var(--ac);background:rgba(210,177,106,.1)}
.lbl{font-size:10px;letter-spacing:.2em;font-weight:700;color:var(--mu);text-transform:uppercase}
.aps{display:flex;flex-wrap:wrap;gap:4px}
.aps button{height:30px;min-width:46px;padding:0 8px;border-radius:8px;border:1px solid var(--ln);background:rgba(255,255,255,.03);font:600 11px/1 var(--mono);color:var(--tx)}
.aps button:hover{border-color:var(--ln2);color:var(--ac)}
details.more summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:'+';color:var(--mu);font-size:16px}
details.more[open] summary::after{content:'–'}
details.more>div{margin-top:8px}
/* legend */
.legend{left:12px;bottom:12px;padding:8px 12px;display:flex;align-items:center;gap:12px;font-size:11px;color:var(--mu)}
.ramp{width:120px;height:6px;border-radius:3px;background:linear-gradient(90deg,#4FB3A5,#7EC4D8 45%,#F2EAD8)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#srcl{font-family:var(--mono);font-size:10px;color:var(--mu)}
/* hover label */
#tip{position:absolute;z-index:1100;pointer-events:none;padding:5px 9px;border-radius:9px;background:var(--glass2);border:1px solid var(--ln);font:600 11px/1.3 var(--mono);white-space:nowrap;transform:translate(14px,-50%);display:none}
#tip span{color:var(--mu);font-weight:500}
/* detail panel */
#detail{top:78px;right:12px;width:370px;max-height:calc(100% - 90px);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--glass2);scrollbar-width:thin}
#detail[hidden]{display:none}
.close{position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid var(--ln);font-size:18px;line-height:1;backdrop-filter:blur(6px)}
.photo{margin:-16px -16px 2px;position:relative;background:#111;aspect-ratio:16/9;overflow:hidden;border-radius:var(--r) var(--r) 0 0}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo a{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#ddd;font-size:10px;padding:3px 8px;border-radius:999px;text-decoration:none}
.photo .none{display:flex;height:100%;align-items:center;justify-content:center;color:var(--mu);font-size:11px;letter-spacing:.14em}
#detail .call{font:600 26px/1 var(--mono);letter-spacing:.02em;color:var(--tx)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:10px;font-weight:700;letter-spacing:.12em;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--mu)}
.tag.g{background:var(--ac);color:#0B0B0C}.tag.r{background:#F87171;color:#0B0B0C}
.muted{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.grid div{background:rgba(14,14,16,.92);padding:9px 11px}
.grid div span{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--mu);font-weight:600}
.grid div b{font:600 13px/1.35 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--ln)}
.route b{display:block;font:600 24px/1 var(--mono);color:var(--tx)}
.route span{font-size:12px;color:var(--mu)}
.route .to{text-align:right}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ln2);color:var(--ac);font-size:11px;font-weight:700;letter-spacing:.1em;text-decoration:none}
.btn:hover{background:rgba(210,177,106,.1)}
/* timeline */
#navs{font-size:13px;line-height:1.5}
.tl{list-style:none;margin:6px 0 0;padding:0;border-left:2px solid rgba(255,255,255,.1);margin-left:7px}
.tl li{position:relative;padding:7px 0 7px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;cursor:pointer;border-radius:8px}
.tl li:hover{background:rgba(255,255,255,.04)}
.tl li::before{content:'';position:absolute;left:-7px;top:12px;width:12px;height:12px;background:#0B0B0C;border:2px solid var(--tx);border-radius:50%}
.tl li.vor::before{border-color:#9CC7FF;border-radius:2px;transform:rotate(45deg) scale(.85)}
.tl li.fix::before{clip-path:polygon(50% 0,100% 100%,0 100%);border:none;background:var(--tx);border-radius:0}
.tl li.now::before{background:var(--gr);border-color:var(--gr)}
.tl li.ahead{opacity:.7}.tl li.ahead::before{border-style:dashed}
.tl .n{font:600 13px/1.3 var(--mono)}.tl .t{font-size:12px;color:var(--mu);grid-column:1/-1}
.tl .r{font:500 12px/1.3 var(--mono);color:var(--ac);text-align:right;white-space:nowrap}
.tlh{font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--mu);margin:10px 0 0}
/* leaflet */
.leaflet-container{font-family:Inter,sans-serif;background:#08090A}
.leaflet-tile-pane{filter:brightness(.82) contrast(1.08) saturate(.5)}
.leaflet-control-zoom{border:none!important;border-radius:12px!important;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)!important}
.leaflet-control-zoom a{background:var(--glass2)!important;color:var(--tx)!important;border-color:var(--ln)!important;width:38px!important;height:38px!important;line-height:38px!important;backdrop-filter:blur(12px)}
.leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:var(--mu)!important;font-size:9px!important;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:var(--mu)!important}
.leaflet-tooltip{background:var(--glass2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;font:600 11px/1.3 var(--mono);box-shadow:none}
.leaflet-tooltip:before{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--glass2);color:var(--tx)}
.apl{background:none;border:none;font:600 10px/1 var(--mono);color:var(--ac);white-space:nowrap;text-shadow:0 0 4px #000,0 0 4px #000}
.apl i{display:inline-block;width:5px;height:5px;border-radius:50%;border:1.5px solid var(--ac);margin-right:4px;vertical-align:1px}
.z-lt6 .apl span{display:none}
.nav{background:none;border:none}
.nav .l{position:absolute;left:14px;top:-3px;font:600 10px/1 var(--mono);color:#9CC7FF;white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000}
.lowzoom .nav .l{display:none}
.nav.hit .l{color:var(--ac);font-size:11px}
.fix{background:none;border:none}
.fix .l{position:absolute;left:13px;top:-4px;font:600 11px/1 var(--mono);color:var(--tx);white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000}
.rwl{background:none;border:none;font:700 11px/1 var(--mono);color:#0B0B0C;text-align:center}
.rwl span{display:inline-block;background:var(--tx);padding:2px 4px;border-radius:3px}
.std{background:none;border:none;font:600 10px/1 var(--mono);color:var(--ac);white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000}
.std i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);margin-right:3px;vertical-align:0}
.z-lt12 .rwl,.z-lt15 .std{display:none}
/* mobile */
@media(max-width:760px){
  .top{top:8px;left:8px;right:8px;gap:8px;padding:6px 8px}
  .brand b{font-size:15px;letter-spacing:.16em}.brand small{display:none}.brand img{width:28px;height:28px}
  .kpi{padding:4px 8px}.kpi b{font-size:14px}.kpi span{font-size:9px}.kpi.v{display:none}
  .live{padding:6px 9px}.live #status{display:none}
  .top{flex-wrap:nowrap}.brand{gap:8px}.brand b{white-space:nowrap;font-size:14px;letter-spacing:.14em}.kpis{gap:4px}.kpi span{white-space:nowrap;font-size:8.5px;letter-spacing:.08em}
  .tools{top:auto;bottom:12px;left:8px;right:8px;width:auto;padding:8px}
  .tools details.more:not([open])>div{display:none}
  .legend{display:none}
  #detail{top:auto;bottom:0;left:0;right:0;width:auto;max-height:62%;border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .photo{border-radius:20px 20px 0 0}
  .leaflet-bottom.leaflet-right{bottom:150px}
}
@media(max-width:760px){.has-detail .tools{display:none}}
.in-frame .brand{display:none}.in-frame .kpis{margin-right:auto}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>

</div>

</div>

<div id="detail" class="ui glass" role="dialog" aria-label="Aircraft details" hidden></div>

function rwPoly(r){const[a1,o1]=r[3],[a2,o2]=r[4];const kx=Math.cos(a1*Math.PI/180)*111320,ky=110574;
  const dx=(o2-o1)*kx,dy=(a2-a1)*ky,len=Math.hypot(dx,dy),hw=r[5]/2,nx=-dy/len*hw,ny=dx/len*hw;
  return[[a1+ny/ky,o1+nx/kx],[a2+ny/ky,o2+nx/kx],[a2-ny/ky,o2-nx/kx],[a1-ny/ky,o1-nx/kx]];}

// navaids a path passes within ~12 km of, in the order flown
function navsOnPath(pts,list=NAVAIDS,tol=12){if(pts.length<2)return[];const hits=[];
  list.forEach(n=>{let best=1e9,bi=-1;for(let i=0;i<pts.length;i++){const d=Math.abs(pts[i][0]-n[4])+Math.abs(pts[i][1]-n[5]);if(d<best){best=d;bi=i;}}
    if(best>0.6)return;let km=1e9;for(let i=Math.max(0,bi-1);i<=Math.min(pts.length-1,bi+1);i++){km=Math.min(km,distKm(pts[i][0],pts[i][1],n[4],n[5]));
      if(i<pts.length-1){const m=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2];km=Math.min(km,distKm(m[0],m[1],n[4],n[5]));}}
    if(km<=tol)hits.push([bi,n]);});
  const seen=new Set();return hits.sort((a,b)=>a[0]-b[0]).map(h=>h[1]).filter(n=>!seen.has(n[0])&&seen.add(n[0]));}

// position now = last report moved along its track at its ground speed (max 60 s)
function posNow(o,now){const p=o.p;let la=p.lat,lo=p.lon;
  if(!onGround(p)&&p.gs>50&&p.track!=null){const dt=Math.min(60,(now-o.base)/1000);if(dt>0){const d=p.gs*0.514444*dt,br=p.track*Math.PI/180;
    la+=d*Math.cos(br)/110574;lo+=d*Math.sin(br)/(111320*Math.cos(la*Math.PI/180));}}
  return[la,lo];}
let screen=[];// [x,y,hex] for hit testing
function draw(){
  const now=Date.now(),z=map.getZoom(),b=map.getBounds().pad(.05);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);screen=[];
  const showGround=z>=9,labels=z>=8;let nLab=0;const base=z<6?13:z<8?16:z<10?19:22;
  let sel=null;
  ac.forEach((o,hex)=>{const a=o.p;if(!pass(a))return;if(onGround(a)&&!showGround)return;
    const[la,lo]=posNow(o,now);o.now=[la,lo];if(!b.contains([la,lo]))return;
    const pt=map.latLngToContainerPoint([la,lo]);screen.push([pt.x,pt.y,hex]);
    if(hex===selected){sel=[pt,a];return;}
    drawPlane(pt,a,base);
    if(labels&&nLab<220&&!onGround(a)){const t=(a.flight||'').trim()||a.r;if(t){nLab++;ctx.font='600 10px "JetBrains Mono",monospace';ctx.fillStyle='rgba(242,234,216,.75)';ctx.fillText(t,pt.x+base*.6,pt.y+3);}}
  });
  if(sel){const[pt,a]=sel;ctx.beginPath();ctx.arc(pt.x,pt.y,base*.95,0,7);ctx.fillStyle='rgba(74,222,128,.14)';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(74,222,128,.8)';ctx.stroke();drawPlane(pt,a,base*1.15);}
  dirty=false;
}
function drawPlane(pt,a,base){const s=base*scaleOf(a)/24;ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(((a.track??a.true_heading??0))*Math.PI/180);ctx.scale(s,s);ctx.translate(-12,-12);
  const heli=(a.category==='A7');ctx.fillStyle=colorOf(a);ctx.strokeStyle='rgba(0,0,0,.85)';ctx.lineWidth=1.4/s*0.9;
  if(isJet(a)&&a.hex!==selected){ctx.shadowColor='rgba(210,177,106,.75)';ctx.shadowBlur=8;}
  ctx.fill(heli?HELI:GLYPH);ctx.shadowBlur=0;ctx.stroke(heli?HELI:GLYPH);ctx.restore();}
let lastDraw=0;
function loop(t){const z=map.getZoom();const every=z>=10?33:z>=7?100:250;if(dirty||t-lastDraw>every){lastDraw=t;draw();}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
map.on('move zoomend viewreset',()=>{dirty=true;});
map.on('moveend',counts);

// ---------- interaction ----------
function hit(x,y,r){let best=null,bd=r*r;for(const s of screen){const d=(s[0]-x)**2+(s[1]-y)**2;if(d<bd){bd=d;best=s[2];}}return best;}
const tip=document.getElementById('tip');
map.on('mousemove',e=>{const h=hit(e.containerPoint.x,e.containerPoint.y,14);const c=map.getContainer();
  if(!h){tip.style.display='none';c.style.cursor='';return;}c.style.cursor='pointer';const a=ac.get(h).p;
  tip.innerHTML=`${esc((a.flight||'').trim()||a.r||h.toUpperCase())} <span>${esc(a.t||'')} · ${onGround(a)?'GND':a.alt_baro!=null?(a.alt_baro>=10000?'FL'+Math.round(a.alt_baro/100):Math.round(a.alt_baro)+' ft'):''}</span>`;
  tip.style.left=e.containerPoint.x+'px';tip.style.top=e.containerPoint.y+'px';tip.style.display='block';});
map.on('mouseout',()=>{tip.style.display='none';});
function select(hex,fly){selected=hex;const o=ac.get(hex);document.documentElement.classList.toggle('has-detail',!!hex);
  if(!o){showDetail(null);drawTrail();dirty=true;return;}
  const a=o.p;data.set(hex,{...a,lat:o.now?o.now[0]:a.lat,lon:o.now?o.now[1]:a.lon});
  if(fly)map.flyTo(o.now||[a.lat,a.lon],Math.max(map.getZoom(),8),{duration:.7});
  showDetail(data.get(hex),true);drawTrail();dirty=true;}
map.on('click',e=>{const touch=e.originalEvent&&e.originalEvent.pointerType==='touch';const h=hit(e.containerPoint.x,e.containerPoint.y,touch?22:14);
  if(h)select(h);else if(selected){selected=null;document.documentElement.classList.remove('has-detail');showDetail(null);drawTrail();dirty=true;}});
function render(){counts();dirty=true;document.documentElement.classList.toggle('has-detail',!!selected);}
const dEl=document.getElementById('detail');L.DomEvent.disableClickPropagation(dEl);L.DomEvent.disableScrollPropagation(dEl);
['tools','top','legend'].forEach(c=>{const el=document.querySelector('.'+c);if(el){L.DomEvent.disableClickPropagation(el);L.DomEvent.disableScrollPropagation(el);}});
// search
const q=document.getElementById('q'),hits=document.getElementById('hits');
function search(){const s=q.value.trim().toUpperCase().replace(/[\s-]/g,'');if(s.length<2){hits.hidden=true;hits.innerHTML='';return[];}
  const res=[];ac.forEach((o,h)=>{const a=o.p;const f=[(a.flight||'').trim(),(a.r||'').replace('-',''),a.t||'',h.toUpperCase(),a.ownOp||''].map(x=>x.toUpperCase().replace(/[\s-]/g,''));if(f.some(x=>x&&x.includes(s)))res.push(a);});
  res.sort((x,y)=>(isJet(y)-isJet(x)));const top=res.slice(0,8);
  hits.innerHTML=top.length?top.map(a=>`<button data-h="${esc(a.hex)}"><span>${esc((a.flight||'').trim()||a.r||a.hex.toUpperCase())}</span><small>${esc(a.r||'')} ${esc(a.t||'')}</small></button>`).join(''):'<span class="muted" style="padding:6px 10px">Not in the air right now</span>';
  hits.hidden=false;return top;}
q.addEventListener('input',search);
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=search();if(r[0]){select(r[0].hex,true);q.blur();}}});
hits.addEventListener('click',e=>{const b=e.target.closest('button[data-h]');if(b){select(b.dataset.h,true);hits.hidden=true;q.value='';}});

// ---------- counts + status ----------
function counts(){let nAll=0,nJet=0,nView=0;const b=map.getBounds();
  ac.forEach(o=>{const a=o.p;if(onGround(a))return;nAll++;if(isJet(a))nJet++;if(pass(a)&&b.contains(o.now||[a.lat,a.lon]))nView++;});
  document.getElementById('nAll').textContent=nAll.toLocaleString('en-GB');document.getElementById('nJet').textContent=nJet;document.getElementById('nView').textContent=nView.toLocaleString('en-GB');}
let lastOk=0;
function showStatus(){const st=document.getElementById('status'),dot=document.getElementById('dot');dot.classList.remove('off','wait');
  if(lastOk&&Date.now()-lastOk<45000){st.textContent='LIVE '+new Date(lastOk).toLocaleTimeString('en-GB');}
  else if(!lastOk){st.textContent='CONNECTING';dot.classList.add('wait');}
  else{st.textContent='RECONNECTING';dot.classList.add('off');}}
setInterval(showStatus,1000);

// ---------- data: browser pulls the open ADS-B networks directly, circle by circle ----------
// 250 nm circles covering the six Gulf states and all of Saudi Arabia
const GRID=[[30.4,38.6],[30.0,44.4],[29.6,49.6],[26.4,36.9],[26.2,43.0],[26.0,49.4],[25.2,55.2],[21.9,39.8],[22.2,45.6],[21.8,51.4],[22.6,57.4],[17.9,43.2],[18.2,50.2],[17.2,55.4]].map(([la,lo])=>({la,lo,r:250,t:0,busy:false}));
const SRC=[
  {n:'adsb.lol',u:c=>`https://api.adsb.lol/v2/point/${c.la}/${c.lo}/${c.r}`,gap:700},
  {n:'adsb.fi',u:c=>`https://opendata.adsb.fi/api/v2/lat/${c.la}/lon/${c.lo}/dist/${c.r}`,gap:1100}
];
SRC.forEach(s=>{s.ok=0;s.fail=0;s.cool=0;s.dead=false;});
function ingest(list,recv){let n=0;for(const p of list){if(!p||!p.hex||p.lat==null||p.lon==null)continue;
    const base=recv-((p.seen_pos!=null?p.seen_pos:p.seen)||0)*1000;const o=ac.get(p.hex);
    if(o&&o.base>base)continue;
    ac.set(p.hex,{p,base,recv,now:o&&o.now});n++;
    if(!onGround(p)){let t=trails.get(p.hex);if(!t){t=[];trails.set(p.hex,t);}const l=t[t.length-1];if(!l||Math.abs(l[0]-p.lat)+Math.abs(l[1]-p.lon)>0.01)t.push([p.lat,p.lon]);if(t.length>240)t.shift();}}
  if(n){lastOk=Date.now();dirty=true;}
  if(selected&&ac.has(selected)){const o=ac.get(selected);data.set(selected,{...o.p});showDetail(data.get(selected));}
  return n;}
function prune(){const now=Date.now();ac.forEach((o,h)=>{const age=now-o.base;if(age>(onGround(o.p)?150000:75000)){ac.delete(h);trails.delete(h);}});counts();}
setInterval(prune,5000);
function nextCircle(){const now=Date.now(),vb=map.getBounds().pad(.2);let best=null,bs=-1;
  for(const c of GRID){if(c.busy)continue;const inView=vb.contains([c.la,c.lo])||distKm(c.la,c.lo,map.getCenter().lat,map.getCenter().lng)<600;
    const score=(now-c.t)*(inView?3:1);if(score>bs){bs=score;best=c;}}
  return best;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function lane(s){
  while(!s.dead){
    if(s.cool>Date.now()){await sleep(s.cool-Date.now());continue;}
    const c=nextCircle();if(!c){await sleep(300);continue;}
    c.busy=true;const t0=Date.now();
    try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(s.u(c),{cache:'no-store',signal:ctl.signal});clearTimeout(to);
      if(r.status===429){s.cool=Date.now()+15000*Math.min(4,++s.fail);throw 0;}
      if(!r.ok)throw 0;const j=await r.json();const l=j.ac||j.aircraft;if(!Array.isArray(l))throw 0;
      ingest(l,Date.now());c.t=Date.now();s.ok++;s.fail=0;srcLabel();
    }catch(e){s.fail++;if(!s.ok&&s.fail>=3)s.dead=true;else if(s.fail>=2&&s.cool<Date.now())s.cool=Date.now()+5000*Math.min(6,s.fail);}
    finally{c.busy=false;}
    await sleep(Math.max(0,s.gap-(Date.now()-t0)));
  }
  srcLabel();
  if(SRC.every(x=>x.dead))serverLane();
}
let serverOn=false;
async function serverPull(){try{const r=await fetch('/api/traffic',{cache:'no-store'});if(!r.ok)return 0;const j=await r.json();return Array.isArray(j.ac)?ingest(j.ac,Date.now()-20000):0;}catch(e){return 0;}}
async function serverLane(){if(serverOn)return;serverOn=true;srcLabel();for(let i=1;;i++){await serverPull();await sleep(10000);
  if(i%12===0&&SRC.every(x=>x.dead)){serverOn=false;SRC.forEach(x=>{x.dead=false;x.fail=0;lane(x);});return;}}}
function srcLabel(){const el=document.getElementById('srcl');const live=SRC.filter(s=>s.ok&&!s.dead).map(s=>s.n);el.textContent=live.length?'via '+live.join(' + '):serverOn?'via server':'';}
// instant first paint: last positions from this browser, then the server snapshot, while the live lanes warm up
try{const c=JSON.parse(localStorage.getItem('jm_live')||'null');if(c&&Date.now()-c.t<10*60000){c.list.forEach(p=>ac.set(p.hex,{p,base:Date.now()-30000,recv:Date.now()}));dirty=true;counts();}}catch(e){}
serverPull().then(counts);
SRC.forEach(s=>lane(s));
setInterval(()=>{try{const keep=['hex','flight','r','t','desc','ownOp','year','lat','lon','alt_baro','gs','track','squawk','category','dbFlags'];
  const list=[];ac.forEach(o=>{if(onGround(o.p))return;const x={};keep.forEach(k=>{if(o.p[k]!=null)x[k]=o.p[k];});if(o.now){x.lat=o.now[0];x.lon=o.now[1];}list.push(x);});
  localStorage.setItem('jm_live',JSON.stringify({t:Date.now(),list}));}catch(e){}},20000);
setInterval(()=>{if(!selected||detailFor!==selected)return;const cur=data.get(selected);if(!cur)return;getFlight(cur,true).then(f=>{if(detailFor===cur.hex)drawRoute(data.get(cur.hex)||cur,null,f.track,false);});},30000);
}
</script>
